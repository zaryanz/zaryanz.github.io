<div class="container-md">
  <div class="row justify-content-center">
    <div class="col-xl-8 col-lg-10">
      <hr />
      <div style="flex-direction: row">
        <p>
          I am open for Software Engineer roles. You can reach out to me
          <a href="mailto:singh@aryn.info">here</a>. My resume can be found
          below:
        </p>
        <div id="resume-download-section">
          <span
            id="resume-pdf-icon"
            class="far fa-file-pdf"
            style="margin-right: 4px"
          ></span>
          <a
            id="resume-download-link"
            target="_blank"
            href="/static/Aryan_Singh_Resume.pdf"
            >Download Resume</a
          >
        </div>
      </div>
    </div>
  </div>
  <div class="pdf-container">
    <iframe src="/static/Aryan_Singh_Resume.pdf" loading="lazy" title="Resume">
    </iframe>
  </div>
</div>

<script>
  /* date formatting logic */
  Date.prototype.toShortFormat = function () {
    const monthNames = [
      "Jan",
      "Feb",
      "Mar",
      "Apr",
      "May",
      "Jun",
      "Jul",
      "Aug",
      "Sep",
      "Oct",
      "Nov",
      "Dec",
    ];
    const day = this.getDate();
    const monthIndex = this.getMonth();
    const monthName = monthNames[monthIndex];
    const year = this.getFullYear();

    return `${day} ${monthName} ${year}`;
  };

  fetch("/static/Aryan_Singh_Resume.pdf").then((data) => {
    let resumeLastModifiedDate = new Date(data.headers.get("Last-Modified"));
    resumeLastModifiedDate = resumeLastModifiedDate.toShortFormat();

    const resumeLink = document.querySelector("#resume-download-link");

    if (window.matchMedia("(max-width: 768px)").matches) {
      resumeLink.innerHTML = `Download/View Resume (Last updated on ${resumeLastModifiedDate})`;
    } else {
      resumeLink.innerHTML = `Download Resume (Last updated on ${resumeLastModifiedDate})`;
    }
  });
</script>
